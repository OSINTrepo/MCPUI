# =============================================================================
# Реестр OSINT MCP-серверов — единый источник правды (спец. §3)
# -----------------------------------------------------------------------------
# Из этого файла генератор (generator/generate.py) собирает:
#   - блок mcpServers в config/librechat.yaml
#   - сервисы в docker-compose.mcp.yml (для transport: stdio)
#   - config/catalog.json — метаданные каталога для UI
#
# Добавить сервер = добавить запись сюда и запустить `python generator/generate.py`.
# Описание полей: registry/README.md
# =============================================================================

# Значения по умолчанию (можно переопределить в записи сервера).
defaults:
  # SSE-порт внутри контейнера, на который supergateway публикует stdio-сервер.
  sse_port: 8000
  # Базовый образ для сборки stdio-серверов (node + python + uv + supergateway).
  base_image: osint-mcp-base:latest

servers:
  # ========================= Оркестратор (агентный режим) ==================
  # Свой MCP-сервер: фронт над всеми остальными. Отдаёт LibreChat 4 инструмента
  # (investigate/plan/catalog/call_server), сам подбирает нужные серверы по задаче
  # и собирает досье. Решает проблему 657 инструментов и даёт «агентное»
  # подключение. Ручной режим (все серверы по отдельности) остаётся.
  - id: orchestrator
    category: meta
    display_name: OSINT Orchestrator
    description: "Опиши задачу — сам подберёт источники и соберёт досье."
    server_instructions: "Для любой OSINT-задачи вызывай investigate(task=<текст пользователя>) и покажи готовый отчёт."
    transport: stdio
    install: docker
    build: servers/orchestrator
    stdio_command: "python /app/server.py"
    env:
      LITELLM_BASE_URL: "http://litellm:4000/v1"
      ORCHESTRATOR_MODEL: "GigaChat-2-Pro"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      REPORTS_DIR: "/reports"
      REPORTS_URL_BASE: "http://localhost:8899"   # адрес reports-сервиса (см. docker-compose.yml)
    volumes:
      - ./config/catalog.json:/app/catalog.json:ro
      - ./reports:/reports
    auth:
      type: none
      user_var: null
    cost_tier: free
    inputs: [query, username, email, domain, ip, company, inn, hash, url, ticker]
    repo: local
    enabled: true

  # ------------------------------- SOCMINT ---------------------------------
  - id: maigret
    category: socmint
    display_name: Maigret
    description: "Ищет аккаунты по нику или почте на 3000+ сайтах и в соцсетях. Дай username или email."
    # Подсказка модели (serverInstructions): maigret медленный без сужения.
    server_instructions: "Всегда вызывай search_username с tags:['social'], иначе запрос уходит в таймаут."
    transport: stdio                 # stdio | http | sse
    install: docker                  # docker | npx | uvx | pip | remote
    build: servers/maigret           # контекст сборки (Dockerfile внутри)
    # Команда запуска stdio-сервера ВНУТРИ контейнера (её оборачивает supergateway).
    stdio_command: "npx -y mcp-maigret"
    # Обёртка запускает maigret через `docker run`, поэтому нужен доступ к
    # docker-сокету хоста, а путь отчётов должен совпадать на хосте и в контейнере.
    env:
      MAIGRET_REPORTS_DIR: /tmp/maigret-reports
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/maigret-reports:/tmp/maigret-reports
    auth:
      type: none                     # none | api_key | oauth
      user_var: null                 # имя переменной ключа (в .env и per-user vault)
    cost_tier: free                  # free | freemium | paid
    inputs: [username, email]
    repo: https://github.com/BurtTheCoder/mcp-maigret
    enabled: true

