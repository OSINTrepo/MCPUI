# =============================================================================
# docker-compose.mcp.yml — СГЕНЕРИРОВАН из registry/servers.yaml
# НЕ РЕДАКТИРОВАТЬ ВРУЧНУЮ. Правь registry/servers.yaml, затем:
#   python generator/generate.py
#
# Один сервис на каждый включённый stdio-сервер. Каждый собирается из
# servers/<id>/Dockerfile и оборачивается supergateway: stdio -> SSE.
# Запуск вместе с базовым стеком:
#   docker compose -f docker-compose.yml -f docker-compose.mcp.yml up -d
# =============================================================================
services:
  orchestrator:
    build:
      context: .
      dockerfile: servers/orchestrator/Dockerfile
      args:
        BASE_IMAGE: osint-mcp-base:latest
    image: osint-mcp-orchestrator:latest
    restart: unless-stopped
    # supergateway публикует stdio-сервер как Streamable HTTP на :8000/mcp
    # (современный транспорт MCP, надёжнее устаревшего SSE). --stateful держит
    # процесс-сервер живым между запросами. /healthz отдаёт 200 сразу.
    # Идемпотентный патч применяется и к ранее собранным образам.
    entrypoint: ["/bin/sh", "-c", 'node /opt/patch_supergateway.js && exec "$@"', "--"]
    command: >
      supergateway --stdio "python /app/server.py"
      --outputTransport streamableHttp --port 8000
      --streamableHttpPath /mcp --stateful
      --healthEndpoint /healthz
    environment:
      MCP_SERVER_ID: "orchestrator"
      ORCHESTRATOR_ENTITY_MIN_SCORE: "${ORCHESTRATOR_ENTITY_MIN_SCORE:-3}"
      ORCHESTRATOR_APPENDIX: "${ORCHESTRATOR_APPENDIX:-slim}"
      ORCHESTRATOR_PAID_SOURCES: "${ORCHESTRATOR_PAID_SOURCES:-0}"
      ORCHESTRATOR_RESOLVE_DEADLINE: "${ORCHESTRATOR_RESOLVE_DEADLINE:-45}"
      ORCHESTRATOR_ENTITY_RESOLVE: "${ORCHESTRATOR_ENTITY_RESOLVE:-1}"
      ORCHESTRATOR_CORPORATE_RESEARCH: "${ORCHESTRATOR_CORPORATE_RESEARCH:-1}"
      ORCHESTRATOR_RESEARCH_DEADLINE: "${ORCHESTRATOR_RESEARCH_DEADLINE:-240}"
      ORCHESTRATOR_RESEARCH_CALLS: "${ORCHESTRATOR_RESEARCH_CALLS:-64}"
      ORCHESTRATOR_COMPANY_DOMAINS: "${ORCHESTRATOR_COMPANY_DOMAINS:-1}"
      NEWDB_MCP_TOKEN: "${NEWDB_MCP_TOKEN:-}"
      LITELLM_BASE_URL: "http://litellm:4000/v1"
      ORCHESTRATOR_MODEL: "${ORCHESTRATOR_MODEL:-deepseek-flash}"
      ORCHESTRATOR_REPORT_MODEL: "${ORCHESTRATOR_REPORT_MODEL:-deepseek-flash}"
      ORCHESTRATOR_DOMAIN_DEEP: "${ORCHESTRATOR_DOMAIN_DEEP:-1}"
      ORCHESTRATOR_VT_RELATIONSHIPS: "${ORCHESTRATOR_VT_RELATIONSHIPS:-4}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      REPORTS_DIR: "/reports"
      REPORTS_URL_BASE: "${REPORTS_URL_BASE:-http://localhost:8899}"
    volumes:
      - "./servers/base/patch_supergateway.js:/opt/patch_supergateway.js:ro"
      - "./config/catalog.json:/app/catalog.json:ro"
      - "./reports:/reports"
    networks:
      - osint
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
