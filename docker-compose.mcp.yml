# =============================================================================
# docker-compose.mcp.yml — СГЕНЕРИРОВАН из registry/servers.yaml
# НЕ РЕДАКТИРОВАТЬ ВРУЧНУЮ. Правь registry/servers.yaml, затем:
#   python generator/generate.py
#
# Один сервис на каждый включённый stdio-сервер. Каждый собирается из
# servers/<id>/Dockerfile и оборачивается supergateway: stdio -> SSE.
# Запуск вместе с базовым стеком:
#   docker compose -f docker-compose.yml -f docker-compose.mcp.yml up -d
# =============================================================================
services:
  orchestrator:
    build:
      context: .
      dockerfile: servers/orchestrator/Dockerfile
      args:
        BASE_IMAGE: osint-mcp-base:latest
    image: osint-mcp-orchestrator:latest
    restart: unless-stopped
    # supergateway публикует stdio-сервер как Streamable HTTP на :8000/mcp
    # (современный транспорт MCP, надёжнее устаревшего SSE). --stateful держит
    # процесс-сервер живым между запросами. /healthz отдаёт 200 сразу.
    command: >
      supergateway --stdio "python /app/server.py"
      --outputTransport streamableHttp --port 8000
      --streamableHttpPath /mcp --stateful
      --healthEndpoint /healthz
    environment:
      MCP_SERVER_ID: "orchestrator"
      LITELLM_BASE_URL: "http://litellm:4000/v1"
      ORCHESTRATOR_MODEL: "GigaChat-2-Pro"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      REPORTS_DIR: "/reports"
      REPORTS_URL_BASE: "http://localhost:8899"
    volumes:
      - "./config/catalog.json:/app/catalog.json:ro"
      - "./reports:/reports"
    networks:
      - osint
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  maigret:
    build:
      context: .
      dockerfile: servers/maigret/Dockerfile
      args:
        BASE_IMAGE: osint-mcp-base:latest
    image: osint-mcp-maigret:latest
    restart: unless-stopped
    # supergateway публикует stdio-сервер как Streamable HTTP на :8000/mcp
    # (современный транспорт MCP, надёжнее устаревшего SSE). --stateful держит
