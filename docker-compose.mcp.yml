      --streamableHttpPath /mcp --stateful
      --healthEndpoint /healthz
    environment:
      MCP_SERVER_ID: "maigret"
      MAIGRET_REPORTS_DIR: "/tmp/maigret-reports"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp/maigret-reports:/tmp/maigret-reports"
    networks:
