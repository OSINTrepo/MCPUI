# =============================================================================
# config/librechat.yaml — СГЕНЕРИРОВАН из registry/servers.yaml
# НЕ РЕДАКТИРОВАТЬ ВРУЧНУЮ. Правь registry/servers.yaml + generator/generate.py,
# затем: python generator/generate.py
# =============================================================================
version: 1.2.8
cache: true

# Разрешённые домены MCP. Непустой список ОТКЛЮЧАЕТ SSRF-защиту LibreChat,
# которая иначе блокирует внутренние docker-хосты (приватные IP). Список
# генерируется из реестра и включает все серверы — внутренние и remote.
mcpSettings:
  allowedDomains:
    - "api.contrastcyber.com"
    - "bgpt.pro"
    - "brightdata"
    - "checko"
    - "companyscope"
    - "crawlgraph.com"
    - "datanexusmcp.com"
    - "directapi"
    - "dnstwist"
    - "domscan.net"
    - "filingfirehose.com"
    - "heliumtrades.com"
    - "intel.twzrd.xyz"
    - "maigret"
    - "nothumansearch.ai"
    - "openosint"
    - "orchestrator"
    - "shodan"
    - "stockscope"
    - "the-stall.intuitek.ai"
    - "virustotal"
    - "voidly"
    - "vulneramcp"
    - "zoomeye"

# Первый вход: показать условия использования (спец. §8).
interface:
  # Закрепить селектор MCP с оркестратором в строке ввода — тогда выбор
  # сервера переносится на новые чаты, а не сбрасывается. Штатная опция
  # LibreChat (interface.defaultPinnedTools: ключи инструментов и/или имена
  # MCP-серверов). Значения выбранных серверов живут в localStorage браузера,
  # их доставляет scripts/librechat-ui-defaults.sh.
  defaultPinnedTools: ["mcp", "orchestrator"]
  termsOfService:
    externalUrl: https://github.com/soxoj/awesome-osint-mcp-servers
    openNewTab: true
    modalAcceptance: true
    modalTitle: "Условия использования OSINT-платформы"
    modalContent: |
      Инструменты предназначены для законной OSINT-аналитики по открытым
      источникам. Запрещены преследование, вторжение в частную жизнь и любое
      незаконное использование. Все запросы логируются (кто, когда, инструмент,
      цель).

# ------------------------------ LLM-эндпоинты --------------------------------
# Все модели идут через LiteLLM-шлюз (OpenAI-совместимый), включая GigaChat.
endpoints:
  custom:
    - name: "GigaChat (Sber)"
      apiKey: "${LITELLM_MASTER_KEY}"
      baseURL: "http://litellm:4000/v1"
      models:
        default: ["GigaChat", "GigaChat-Pro", "GigaChat-Max", "GigaChat-2-Max", "GigaChat-2-Pro"]
        fetch: false
      titleConvo: true
      titleModel: "GigaChat"
      modelDisplayLabel: "GigaChat"
      # Контекст GigaChat-2 ~128k. Без этого LibreChat берёт малый дефолт (~30k),
      # и определения MCP-инструментов не влезают. (Классические GigaChat/-Pro/-Max
      # реально 32k — не грузите в них десятки инструментов сразу.)
      maxContextTokens: 128000

    - name: "Cloud (Claude/GPT/DeepSeek via LiteLLM)"
      apiKey: "${LITELLM_MASTER_KEY}"
      baseURL: "http://litellm:4000/v1"
      models:
        default: ["deepseek-chat", "deepseek-reasoner", "claude-opus-4-8", "claude-sonnet-5", "gpt-4o", "gpt-4o-mini"]
        fetch: false
      titleConvo: true
      titleModel: "gpt-4o-mini"
      modelDisplayLabel: "Cloud"
      # Работает только когда в .env задан соответствующий ключ:
      # DEEPSEEK_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY.
      maxContextTokens: 128000

    # Локальная модель — ОПЦИОНАЛЬНА. Эндпоинт остаётся в UI, но отвечает только
    # когда поднят профиль local-llm (docker compose --profile local-llm up -d
    # ollama ollama-init) ИЛИ своя Ollama на хосте (OLLAMA_BASE_URL в .env).
    - name: "Local (Ollama via LiteLLM)"
      apiKey: "${LITELLM_MASTER_KEY}"
      baseURL: "http://litellm:4000/v1"
      models:
        default: ["qwen2.5"]
        fetch: false
      titleConvo: true
      titleModel: "qwen2.5"
      modelDisplayLabel: "Local"

# --------------------------- Пресеты (modelSpecs) ----------------------------
# «GigaChat · OSINT» — готовый пресет: GigaChat-2-Pro + большой контекст (чтобы
# влезали десятки определений MCP-инструментов; прямой чат иначе берёт дефолт
# ~30k) + системный промпт с рецептами. Выберите его как «модель» в шапке чата.
modelSpecs:
  enforce: false
  prioritize: true
  list:
    # АГЕНТНЫЙ режим (по умолчанию): виден только один сервер — orchestrator.
    # Пользователь описывает задачу, агент сам подбирает серверы и собирает досье.
    # mcpServers — на УРОВНЕ modelSpec (сестра preset), а НЕ внутри preset:
    # LibreChat читает spec.mcpServers (dk: {mcp: modelSpec.mcpServers}) и сам
    # проставляет сервер в выбор нового чата. Внутри preset это поле игнорируется.
    - name: "gigachat-osint-auto"
      label: "GigaChat · OSINT Авто"
      description: "Опишите задачу — агент сам подберёт серверы и соберёт досье"
      default: true
      mcpServers: ["orchestrator"]
      preset:
        endpoint: "GigaChat (Sber)"
        model: "GigaChat-2-Pro"
        maxContextTokens: 128000
        promptPrefix: |
          # OSINT-агент (авто-режим)

          Ты — помощник OSINT-аналитика. У тебя есть один инструмент-оркестратор, который
          сам подбирает нужные источники и собирает досье. Не пытайся вызывать отдельные
          серверы — работай только через оркестратор.

          ## Как действовать

          1. На любой запрос-расследование (проверить username, домен, IP, компанию/ИНН,
             хеш/URL, или собрать досье) — сразу вызови инструмент **`investigate`**,
             передав в `task` текст запроса пользователя дословно.
          2. Ответ `investigate` — это **готовая сводка со ссылками на полный отчёт
             (Markdown и PDF)**. Покажи его пользователю **дословно, как есть**. ОБЯЗАТЕЛЬНО
             сохрани ОБЕ строки ссылок — «📄 Открыть: …» (просмотр) и «⬇️ Скачать: …»
             (файлом на диск) — и все ссылки-профили
             в находках — НЕ сокращай их, НЕ убирай и НЕ заменяй названиями. Полная
             детализация лежит в файлах отчёта; в чате главное — сохранить ссылки.
          3. Если пользователь хочет сперва увидеть, какие источники будут задействованы —
             вызови **`plan`** и покажи план; после подтверждения вызови `investigate`.
          4. Если спрашивают «что ты умеешь / какие источники есть» — вызови **`catalog`**
             и перечисли категории и инструменты простым языком.
          5. Нужен конкретный источник напрямую — используй **`call_server`**.

          ## Категорически запрещено выдумывать (главное правило)

          - **Нет вызова `investigate` — нет отчёта.** Пока ты фактически не вызвал
            инструмент и не получил его ответ, у тебя НЕТ ни находок, ни файлов, ни
            ссылок. В этом случае просто вызови инструмент.
          - **Никаких придуманных ссылок.** Вставляй в ответ только те URL, которые
            дословно вернул инструмент. Настоящие ссылки на отчёт ВСЕГДА начинаются с
            `http://localhost:8899/`. Если ты собираешься написать ссылку на
            `github.com`, `cdn.jsdelivr.net`, `drive.google.com` или любой другой домен —
            значит, ты её выдумываешь. Так делать нельзя.
          - **Не пиши «проверено с помощью investigate»**, если вызова не было.
          - Если инструмент вернул ошибку или ничего не нашёл — так и напиши. Ответ без
            находок честнее выдуманного отчёта.
          - Все сгенерированные отчёты всегда доступны списком: http://localhost:8899/

          ## Правила

          - Только законная OSINT-аналитика по открытым источникам. Отказывай в
            преследовании и деанонимизации ради вреда.
          - Никогда не выдумывай результат: если оркестратор вернул «источник недоступен»
            или пусто — так и скажи.
          - Отвечай на языке пользователя (по умолчанию — русском).


    # Ручной пресет (gigachat-osint) убран: он показывал модели ВСЕ серверы (657
