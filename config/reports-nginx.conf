# Раздача сгенерированных отчётов оркестратора (./reports → :8899).
#
# Зачем нужен autoindex: LLM в чате может «придумать» ссылку на отчёт (слабые
# модели вроде GigaChat иногда отвечают, не вызвав инструмент). Открыв
# http://localhost:8899/ пользователь видит РЕАЛЬНЫЙ список файлов — то, что
# действительно сгенерировано, а не то, что «вспомнила» модель.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Список всех отчётов (новые сверху не сортируются, но видны дата и размер).
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # .md показываем прямо в браузере, а не отдаём на скачивание
    # (mime по умолчанию text/markdown → браузер скачивает файл).
    location ~* \.md$ {
        default_type text/plain;
        charset utf-8;
    }

    # Те же файлы, но принудительно «Сохранить как…»:
    #   просмотр  — http://localhost:8899/<файл>
    #   скачивание — http://localhost:8899/download/<файл>
    # Нужно, потому что браузер открывает .md и .pdf во вкладке, а аналитику
    # обычно нужен файл на диск (приложить к делу, отправить коллеге).
    location ^~ /download/ {
        alias /usr/share/nginx/html/;
        autoindex off;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
    }
}
